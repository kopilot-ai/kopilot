name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src/ tests/
      - name: Ruff format check
        run: ruff format --check src/ tests/
      - name: Mypy
        # pyproject.toml pins python_version=3.11 for [tool.mypy], which mypy
        # applies to third-party stub parsing too; a transitive numpy stub uses
        # PEP 695 syntax that only parses under 3.12+, so override on the CLI
        # rather than touch the shared config.
        run: mypy --ignore-missing-imports --python-version 3.13 src/kopilot

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: Run unit tests
        # Coverage floor measured at 75% on 2026-08-22; set 2 points below to
        # leave headroom while still catching real regressions.
        run: pytest tests/ -v --ignore=tests/test_integration_smoke.py --cov=kopilot --cov-report=term --cov-fail-under=73

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image (no push)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: kopilot:ci-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy scan (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kopilot:ci-scan
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          # Unfixed OS-level CVEs are common base-image noise Kopilot can't
          # resolve by updating its own deps; suppress those, not fixable
          # HIGH/CRITICAL findings. If a real exception is ever needed, add
          # a .trivyignore with a comment citing the CVE and why, and wire
          # `trivyignores: .trivyignore` in here.
          ignore-unfixed: true

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - name: Helm lint
        run: helm lint helm/kopilot
      - name: Helm template (defaults)
        run: helm template test helm/kopilot > /dev/null
      - name: Helm template (secrets + custom skills)
        run: >
          helm template test helm/kopilot
          --set api.authToken=ci-token
          --set gemini.apiKey=ci-key
          --set customSkillsConfigMap=ci-skills > /dev/null
      - name: Validate CRDs and quickstart with kubeconform
        run: |
          curl -fsSLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  kubeconform.tar.gz" | sha256sum -c -
          tar xzf kubeconform.tar.gz kubeconform
          ./kubeconform -strict -ignore-missing-schemas helm/kopilot/crds/*.yaml deploy/quickstart.yaml
