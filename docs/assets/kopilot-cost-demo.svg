<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#09090b"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6366f1"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="760" rx="28" fill="url(#bg)"/>
  <circle cx="1040" cy="108" r="180" fill="#312e81" opacity="0.24"/>
  <circle cx="180" cy="672" r="160" fill="#0f766e" opacity="0.18"/>

  <text x="72" y="88" fill="#F8FAFC" font-size="36" font-family="Inter, Arial, sans-serif" font-weight="700">
    Kopilot Cost Optimization Walkthrough
  </text>
  <text x="72" y="126" fill="#94A3B8" font-size="19" font-family="Inter, Arial, sans-serif">
    Explain wasted Kubernetes spend, show evidence, and recommend approval-gated follow-up actions.
  </text>

  <g filter="url(#shadow)">
    <rect x="72" y="168" width="820" height="500" rx="24" fill="#0B1120" stroke="#1E293B" stroke-width="2"/>
    <rect x="72" y="168" width="820" height="58" rx="24" fill="#111827"/>
    <rect x="72" y="202" width="820" height="24" fill="#111827"/>
    <circle cx="112" cy="197" r="7" fill="#FB7185"/>
    <circle cx="138" cy="197" r="7" fill="#FBBF24"/>
    <circle cx="164" cy="197" r="7" fill="#34D399"/>
    <text x="440" y="203" fill="#64748B" font-size="15" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">
      kopilot ask "Find over-provisioned deployments and orphaned PVCs"
    </text>

    <text x="108" y="268" fill="#E2E8F0" font-size="20" font-family="JetBrains Mono, Consolas, monospace">
      $ kopilot ask "Find over-provisioned deployments and orphaned PVCs"
    </text>
    <text x="108" y="312" fill="#22D3EE" font-size="18" font-family="JetBrains Mono, Consolas, monospace">
      Delegating to cost_optimization
    </text>
    <text x="108" y="352" fill="#94A3B8" font-size="18" font-family="JetBrains Mono, Consolas, monospace">
      &gt; kubectl top pods -A
    </text>
    <text x="108" y="388" fill="#94A3B8" font-size="18" font-family="JetBrains Mono, Consolas, monospace">
      &gt; kubectl get deploy -A -o json
    </text>
    <text x="108" y="424" fill="#94A3B8" font-size="18" font-family="JetBrains Mono, Consolas, monospace">
      &gt; kubectl get pvc -A
    </text>

    <text x="108" y="482" fill="#34D399" font-size="21" font-family="JetBrains Mono, Consolas, monospace" font-weight="700">
      Result:
    </text>
    <text x="108" y="520" fill="#E2E8F0" font-size="18" font-family="JetBrains Mono, Consolas, monospace">
      - checkout-worker requests 2000m CPU but averages 240m
    </text>
    <text x="108" y="556" fill="#E2E8F0" font-size="18" font-family="JetBrains Mono, Consolas, monospace">
      - 3 PVCs are unbound for 19d in staging
    </text>
    <text x="108" y="592" fill="#A7F3D0" font-size="18" font-family="JetBrains Mono, Consolas, monospace">
      Recommendation: lower CPU requests to 500m and review PVC cleanup
    </text>
    <text x="108" y="628" fill="#FCD34D" font-size="18" font-family="JetBrains Mono, Consolas, monospace">
      Destructive cleanup remains approval-gated
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect x="930" y="208" width="210" height="132" rx="20" fill="#111827" stroke="#334155" stroke-width="2"/>
    <text x="960" y="252" fill="#F8FAFC" font-size="22" font-family="Inter, Arial, sans-serif" font-weight="700">Evidence</text>
    <text x="960" y="286" fill="#CBD5E1" font-size="18" font-family="Inter, Arial, sans-serif">Top metrics</text>
    <text x="960" y="314" fill="#CBD5E1" font-size="18" font-family="Inter, Arial, sans-serif">Requests vs usage</text>

    <rect x="930" y="364" width="210" height="132" rx="20" fill="#111827" stroke="#334155" stroke-width="2"/>
    <text x="960" y="408" fill="#F8FAFC" font-size="22" font-family="Inter, Arial, sans-serif" font-weight="700">Safety</text>
    <text x="960" y="442" fill="#CBD5E1" font-size="18" font-family="Inter, Arial, sans-serif">Read-first flow</text>
    <text x="960" y="470" fill="#CBD5E1" font-size="18" font-family="Inter, Arial, sans-serif">Approval gates</text>

    <rect x="930" y="520" width="210" height="132" rx="20" fill="#111827" stroke="#334155" stroke-width="2"/>
    <text x="960" y="564" fill="#F8FAFC" font-size="22" font-family="Inter, Arial, sans-serif" font-weight="700">Outcome</text>
    <text x="960" y="598" fill="#CBD5E1" font-size="18" font-family="Inter, Arial, sans-serif">Explain cost waste</text>
    <text x="960" y="626" fill="#CBD5E1" font-size="18" font-family="Inter, Arial, sans-serif">Recommend next step</text>
  </g>

  <rect x="72" y="696" width="210" height="34" rx="17" fill="url(#brand)" opacity="0.92"/>
  <text x="177" y="718" fill="#FFFFFF" font-size="16" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="700">
    approval-gated recommendations
  </text>
</svg>
