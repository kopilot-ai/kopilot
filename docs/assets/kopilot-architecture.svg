<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="brand" x1="96" y1="92" x2="1104" y2="668" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="1200" height="760" rx="28" fill="url(#bg)"/>
  <text x="80" y="88" fill="#F8FAFC" font-size="36" font-family="Inter, Arial, sans-serif" font-weight="700">
    Kopilot Architecture At A Glance
  </text>
  <text x="80" y="126" fill="#94A3B8" font-size="19" font-family="Inter, Arial, sans-serif">
    Natural-language requests route through a supervisor, specialized skills, and an approval-gated executor.
  </text>

  <g filter="url(#shadow)">
    <rect x="96" y="176" width="220" height="116" rx="20" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <text x="206" y="222" fill="#F8FAFC" font-size="24" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="700">
      Inputs
    </text>
    <text x="206" y="254" fill="#CBD5E1" font-size="18" text-anchor="middle" font-family="Inter, Arial, sans-serif">
      CLI
    </text>
    <text x="206" y="280" fill="#CBD5E1" font-size="18" text-anchor="middle" font-family="Inter, Arial, sans-serif">
      API, Slack, Webhooks
    </text>

    <rect x="386" y="176" width="428" height="156" rx="24" fill="#111827" stroke="url(#brand)" stroke-width="2.5"/>
    <text x="600" y="224" fill="#F8FAFC" font-size="28" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="700">
      Supervisor
    </text>
    <text x="600" y="262" fill="#CBD5E1" font-size="18" text-anchor="middle" font-family="Inter, Arial, sans-serif">
      Routes requests to the right skill, synthesizes findings,
    </text>
    <text x="600" y="288" fill="#CBD5E1" font-size="18" text-anchor="middle" font-family="Inter, Arial, sans-serif">
      and preserves a read-first investigation flow.
    </text>

    <rect x="884" y="176" width="220" height="116" rx="20" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <text x="994" y="222" fill="#F8FAFC" font-size="24" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="700">
      Outputs
    </text>
    <text x="994" y="254" fill="#CBD5E1" font-size="18" text-anchor="middle" font-family="Inter, Arial, sans-serif">
      Findings
    </text>
    <text x="994" y="280" fill="#CBD5E1" font-size="18" text-anchor="middle" font-family="Inter, Arial, sans-serif">
      Actions and recommendations
    </text>

    <rect x="180" y="414" width="180" height="108" rx="18" fill="#111827" stroke="#334155" stroke-width="2"/>
    <text x="270" y="458" fill="#F8FAFC" font-size="21" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="700">
      Cost
    </text>
    <text x="270" y="488" fill="#CBD5E1" font-size="17" text-anchor="middle" font-family="Inter, Arial, sans-serif">
      rightsizing
    </text>

    <rect x="390" y="414" width="180" height="108" rx="18" fill="#111827" stroke="#334155" stroke-width="2"/>
    <text x="480" y="458" fill="#F8FAFC" font-size="21" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="700">
      Security
    </text>
    <text x="480" y="488" fill="#CBD5E1" font-size="17" text-anchor="middle" font-family="Inter, Arial, sans-serif">
      RBAC and policy
    </text>

    <rect x="600" y="414" width="180" height="108" rx="18" fill="#111827" stroke="#334155" stroke-width="2"/>
    <text x="690" y="458" fill="#F8FAFC" font-size="21" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="700">
      Troubleshooting
    </text>
    <text x="690" y="488" fill="#CBD5E1" font-size="17" text-anchor="middle" font-family="Inter, Arial, sans-serif">
      logs and events
    </text>

    <rect x="810" y="414" width="180" height="108" rx="18" fill="#111827" stroke="#334155" stroke-width="2"/>
    <text x="900" y="458" fill="#F8FAFC" font-size="21" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="700">
      Custom Skills
    </text>
    <text x="900" y="488" fill="#CBD5E1" font-size="17" text-anchor="middle" font-family="Inter, Arial, sans-serif">
      YAML and CRDs
    </text>

    <rect x="278" y="592" width="644" height="92" rx="22" fill="#0B1120" stroke="#334155" stroke-width="2"/>
    <text x="600" y="632" fill="#F8FAFC" font-size="26" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="700">
      Executor Middleware
    </text>
    <text x="600" y="664" fill="#CBD5E1" font-size="18" text-anchor="middle" font-family="Inter, Arial, sans-serif">
      kubectl, helm, shell, and read_resource with audit logs, protected namespaces, and approval gates
    </text>
  </g>

  <path d="M316 234H386" stroke="url(#brand)" stroke-width="4" stroke-linecap="round"/>
  <path d="M814 234H884" stroke="url(#brand)" stroke-width="4" stroke-linecap="round"/>
  <path d="M600 332V390" stroke="url(#brand)" stroke-width="4" stroke-linecap="round"/>
  <path d="M600 522V592" stroke="url(#brand)" stroke-width="4" stroke-linecap="round"/>

  <rect x="84" y="688" width="172" height="38" rx="19" fill="#1E293B"/>
  <text x="170" y="712" fill="#E2E8F0" text-anchor="middle" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="700">
    read-first
  </text>
  <rect x="274" y="688" width="208" height="38" rx="19" fill="#1E293B"/>
  <text x="378" y="712" fill="#E2E8F0" text-anchor="middle" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="700">
    approval-gated
  </text>
  <rect x="500" y="688" width="188" height="38" rx="19" fill="#1E293B"/>
  <text x="594" y="712" fill="#E2E8F0" text-anchor="middle" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="700">
    audit-logged
  </text>
  <rect x="706" y="688" width="242" height="38" rx="19" fill="#1E293B"/>
  <text x="827" y="712" fill="#E2E8F0" text-anchor="middle" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="700">
    self-hosted by default
  </text>
</svg>
