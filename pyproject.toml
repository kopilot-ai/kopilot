[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kubedevaiops"
version = "0.3.0"
description = "Kopilot is an autonomous AI-powered Kubernetes operations agent"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [
    {name = "Riadh HAJ AMOR"},
]
keywords = ["kubernetes", "aiops", "devops", "langchain", "operator", "autonomous-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    "langchain>=1.0.0",
    "langchain-core>=1.0.0",
    "langchain-community>=0.3.0",
    "langchain-ollama>=1.0.0",
    "langchain-openai>=0.3.0",
    "langchain-google-genai>=4.0.0",
    "langchain-anthropic>=1.0.0",
    "langgraph>=1.0.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "kopf>=1.37.0",
    "kubernetes>=31.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "slack-bolt>=1.21.0",
    "prometheus-client>=0.21.0",
    "structlog>=24.4.0",
    "click>=8.1.0",
    "jinja2>=3.1.0",
    "mcp>=2.0.0,<3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "tenacity>=9.0.0",
    "cachetools>=5.5.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[project.scripts]
kopilot = "kubedevaiops.__main__:cli"
kubedevaiops = "kubedevaiops.__main__:cli"

[project.urls]
Homepage = "https://github.com/kopilot-ai/kopilot"
Repository = "https://github.com/kopilot-ai/kopilot"
Issues = "https://github.com/kopilot-ai/kopilot/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/kubedevaiops"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests requiring live services (Ollama, Gemini, K8s)",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
