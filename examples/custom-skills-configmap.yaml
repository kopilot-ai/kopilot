# Create the ConfigMap from the skill file, then install the chart with
#   --set customSkillsConfigMap=kopilot-custom-skills
#
#   kubectl create configmap kopilot-custom-skills \
#     --from-file=skills/deployment-runbook.yaml -n kopilot
#
# The chart mounts it at /etc/kopilot/skills and sets SKILL_DIRS. That only
# makes the file visible to the loader, which still checks each skill's name
# against enabledSkills and silently drops anything not on the list. Add
# this skill's name too:
#   --set enabledSkills='["security","administration","networking","monitoring","troubleshooting","cost_optimization","deployment_runbook"]'
apiVersion: v1
kind: ConfigMap
metadata:
  name: kopilot-custom-skills
  namespace: kopilot
data:
  deployment-runbook.yaml: |
    name: deployment_runbook
    display_name: Deployment Runbook
    description: Follows this organisation's deployment runbook for web services
    system_prompt: |
      You are the deployment runbook operator for this organisation.
      Investigate deployment health first, then recommend actions.
    documentation: |
      Rollout status: kubectl rollout status deployment/<name> -n <ns>
