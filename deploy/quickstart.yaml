# Kopilot quickstart manifest — FOR LAB/EVALUATION CLUSTERS ONLY.
#
# Apply CRDs first:   kubectl apply -f helm/kopilot/crds/
# Then this file:     kubectl apply -f deploy/quickstart.yaml
#
# The service account below gets a scoped ClusterRole: reads, plus
# create/update/patch on Deployments and StatefulSets. Nothing here can delete
# a workload, create a Pod, or read a Secret. Review it before applying, and
# prefer the Helm chart for anything beyond a first look.
#
# The Service is ClusterIP. Reach the API by port-forwarding it:
#   kubectl port-forward -n kopilot svc/kopilot 8080:8080
#
# No auth token is set, which is why nothing is published off-cluster. Before
# this goes anywhere shared, create a token and reference it:
#   kubectl create secret generic kopilot-auth -n kopilot \
#     --from-literal=API_AUTH_TOKEN="$(openssl rand -hex 16)"
# then add an envFrom secretRef for it to the Deployment below.
---
apiVersion: v1
kind: Namespace
metadata:
  name: kopilot
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kopilot-config
  namespace: kopilot
data:
  LLM_PROVIDER: "ollama"
  LLM_MODEL: "gpt-oss:20b"
  # host.docker.internal resolves on Docker Desktop (macOS/Windows).
  # On Linux kind clusters use your host IP or an in-cluster Ollama Service.
  OLLAMA_BASE_URL: "http://host.docker.internal:11434"
  API_PORT: "8080"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  # Gates every mutating command on a human approval, not just deletions.
  SAFETY_REQUIRE_APPROVAL_DESTRUCTIVE: "true"
  # 0 = observe, 1 = copilot (approval-gated), 2 = autopilot.
  AUTONOMY_LEVEL: "1"
  # Event-driven investigations feed attacker-controllable event text into an
  # LLM prompt. Off until that input is treated as untrusted.
  WATCHERS_K8S_EVENTS_ENABLED: "false"
  ENABLED_SKILLS: '["security","administration","networking","monitoring","troubleshooting","cost_optimization"]'
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kopilot
  namespace: kopilot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kopilot-quickstart
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "endpoints", "events",
                "configmaps", "namespaces", "nodes",
                "persistentvolumes", "persistentvolumeclaims",
                "serviceaccounts", "resourcequotas", "limitranges"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets",
                "deployments/scale", "statefulsets/scale"]
    verbs: ["get", "list", "watch"]
  # The only writes the shipped administration skill issues: create a
  # Deployment, scale it, roll it back. No delete, and nothing on DaemonSets.
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: ["update", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["kopilot-ai.github.io"]
    resources: ["aitasks", "aitasks/status", "aiskills", "aiskills/status",
                "aipolicies", "aipolicies/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kopilot-quickstart
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kopilot-quickstart
subjects:
  - kind: ServiceAccount
    name: kopilot
    namespace: kopilot
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kopilot
  namespace: kopilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kopilot
  template:
    metadata:
      labels:
        app: kopilot
    spec:
      serviceAccountName: kopilot
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          # Pinned, not :latest — a quickstart that silently changes what it
          # runs is not a quickstart.
          image: ghcr.io/kopilot-ai/kopilot:0.5.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: kopilot-config
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kopilot
  namespace: kopilot
spec:
  # ClusterIP, not NodePort: reach it with
  #   kubectl port-forward -n kopilot svc/kopilot 8080:8080
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: kopilot
