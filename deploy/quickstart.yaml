# Kopilot quickstart manifest — FOR LAB/EVALUATION CLUSTERS ONLY.
#
# Apply CRDs first:   kubectl apply -f helm/kopilot/crds/
# Then this file:     kubectl apply -f deploy/quickstart.yaml
#
# The service account below gets a scoped ClusterRole (read-most, write on
# workloads). Review it before applying, and prefer the Helm chart for
# anything beyond a first look. The API is exposed on NodePort 30080 with no
# auth token set — do not use this manifest on a shared or reachable cluster
# without setting API_AUTH_TOKEN.
---
apiVersion: v1
kind: Namespace
metadata:
  name: kopilot
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kopilot-config
  namespace: kopilot
data:
  LLM_PROVIDER: "ollama"
  LLM_MODEL: "gpt-oss:20b"
  # host.docker.internal resolves on Docker Desktop (macOS/Windows).
  # On Linux kind clusters use your host IP or an in-cluster Ollama Service.
  OLLAMA_BASE_URL: "http://host.docker.internal:11434"
  API_PORT: "8080"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  SAFETY_REQUIRE_APPROVAL_DESTRUCTIVE: "true"
  ENABLED_SKILLS: '["security","administration","networking","monitoring","troubleshooting","cost_optimization"]'
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kopilot
  namespace: kopilot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kopilot-quickstart
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "endpoints", "events",
                "configmaps", "namespaces", "nodes",
                "persistentvolumes", "persistentvolumeclaims",
                "serviceaccounts", "resourcequotas", "limitranges"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["kopilot-ai.github.io"]
    resources: ["aitasks", "aitasks/status", "aiskills", "aiskills/status",
                "aipolicies", "aipolicies/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kopilot-quickstart
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kopilot-quickstart
subjects:
  - kind: ServiceAccount
    name: kopilot
    namespace: kopilot
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kopilot
  namespace: kopilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kopilot
  template:
    metadata:
      labels:
        app: kopilot
    spec:
      serviceAccountName: kopilot
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: ghcr.io/kopilot-ai/kopilot:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: kopilot-config
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kopilot
  namespace: kopilot
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
  selector:
    app: kopilot
