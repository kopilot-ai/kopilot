# Kopilot runs a single replica: conversation state and the approval queue
# are in-process. Running more than one replica would split the approval
# queue and double-process AITask resources.
replicaCount: 1

image:
  repository: ghcr.io/kopilot-ai/kopilot
  # Defaults to the chart's appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: kubedevaiops

# LLM configuration
llm:
  provider: ollama
  model: "gpt-oss:20b"
  temperature: "0.1"
  maxTokens: "4096"
  requestTimeout: "120"

# Ollama endpoint (adjust for your cluster)
ollama:
  baseUrl: http://ollama.ollama.svc.cluster.local:11434

# Hosted providers (optional). Keys set here are rendered into the release
# Secret; for production prefer existingSecret below.
openai:
  apiKey: ""
  model: gpt-4o

gemini:
  apiKey: ""
  model: gemini-2.5-flash

anthropic:
  apiKey: ""
  model: claude-opus-5

azureOpenai:
  endpoint: ""
  apiKey: ""
  deployment: gpt-4o
  apiVersion: "2024-08-01-preview"

# Name of a pre-created Secret with any of the env vars the app reads
# (OPENAI_API_KEY, GEMINI_API_KEY, ANTHROPIC_API_KEY, AZURE_OPENAI_API_KEY,
# API_AUTH_TOKEN, API_WEBHOOK_SECRET, SLACK_*). When set, inline keys above
# are ignored and no chart-managed secret is created.
existingSecret: ""

# API server
api:
  host: "0.0.0.0"
  port: 8080
  # Bearer token required on /tasks, /tasks/history, /metrics and /approvals.
  # Strongly recommended. Ignored when existingSecret is set (put
  # API_AUTH_TOKEN in the secret instead).
  authToken: ""
  # HMAC secret for POST /webhook (webhooks stay disabled when empty).
  webhookSecret: ""

# Slack integration (optional)
# The Slack bot starts when both tokens are set.
slack:
  botToken: ""
  appToken: ""
  signingSecret: ""
  # JSON list of Slack user IDs allowed to run tasks, e.g. '["U0123ABC"]'
  allowedUsers: "[]"

# Safety guardrails
safety:
  requireApprovalDestructive: "true"
  maxConcurrentTasks: "5"
  protectedNamespaces: '["kube-system","kube-public","kube-node-lease"]'
  # Directories read_resource() may read files from (JSON list)
  readPaths: '["/etc/kubedevaiops"]'

# Autonomy dial: 0 = observe (mutations refused), 1 = copilot
# (approval-gated, default), 2 = autopilot inside autopilotNamespaces.
# AIPolicy CRDs adjust this at runtime without a redeploy.
autonomy:
  level: "1"
  # JSON list, e.g. '["staging","qa"]' — required when level is 2
  autopilotNamespaces: "[]"

# Built-in skills to enable (loaded from YAML definitions at startup)
enabledSkills: '["security","administration","networking","monitoring","troubleshooting","cost_optimization"]'

# Custom skills: name of a ConfigMap whose keys are *.yaml skill definitions.
# It is mounted at /etc/kubedevaiops/skills and SKILL_DIRS is set accordingly.
customSkillsConfigMap: ""

# Approval queue durability. The store is written to /data/approvals.db so
# pending approvals survive container restarts. By default /data is an
# emptyDir (survives container restarts, not pod deletion); enable
# persistence for a PVC that survives pod rescheduling.
persistence:
  enabled: false
  size: 1Gi
  storageClass: ""
  accessModes: ["ReadWriteOnce"]

# Observability
# Prometheus metrics are served on the API port at /metrics (bearer-protected
# when an auth token is set) — there is no separate metrics listener.
observability:
  logLevel: INFO
  logFormat: json

service:
  type: ClusterIP
  port: 8080

podSecurityContext:
  runAsNonRoot: true
  # Image user is UID 10001; fsGroup makes /data writable for the
  # SQLite-backed approval store.
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false  # kubectl/helm write cache files under $HOME
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

nodeSelector: {}
tolerations: []
affinity: {}
