apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubedevaiops.fullname" . }}-config
  labels:
    {{- include "kubedevaiops.labels" . | nindent 4 }}
data:
  LLM_PROVIDER: {{ .Values.llm.provider | quote }}
  LLM_MODEL: {{ .Values.llm.model | quote }}
  LLM_TEMPERATURE: {{ .Values.llm.temperature | quote }}
  LLM_MAX_TOKENS: {{ .Values.llm.maxTokens | quote }}
  LLM_REQUEST_TIMEOUT: {{ .Values.llm.requestTimeout | quote }}
  OLLAMA_BASE_URL: {{ .Values.ollama.baseUrl | quote }}
  API_HOST: {{ .Values.api.host | quote }}
  API_PORT: {{ .Values.api.port | quote }}
  SAFETY_DRY_RUN_DEFAULT: {{ .Values.safety.dryRunDefault | quote }}
  SAFETY_REQUIRE_APPROVAL_DESTRUCTIVE: {{ .Values.safety.requireApprovalDestructive | quote }}
  SAFETY_MAX_CONCURRENT_TASKS: {{ .Values.safety.maxConcurrentTasks | quote }}
  SAFETY_PROTECTED_NAMESPACES: {{ .Values.safety.protectedNamespaces | quote }}
  ENABLED_SKILLS: {{ .Values.enabledSkills | quote }}
  LOG_LEVEL: {{ .Values.observability.logLevel | quote }}
  LOG_FORMAT: {{ .Values.observability.logFormat | quote }}
  METRICS_ENABLED: {{ .Values.observability.metricsEnabled | quote }}
  METRICS_PORT: {{ .Values.observability.metricsPort | quote }}
