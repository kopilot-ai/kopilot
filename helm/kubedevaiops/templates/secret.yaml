{{- if not .Values.existingSecret }}
{{- if or .Values.openai.apiKey .Values.gemini.apiKey .Values.anthropic.apiKey .Values.azureOpenai.apiKey .Values.api.authToken .Values.api.webhookSecret .Values.slack.botToken }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubedevaiops.fullname" . }}-secrets
  labels:
    {{- include "kubedevaiops.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.openai.apiKey }}
  OPENAI_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.gemini.apiKey }}
  GEMINI_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.anthropic.apiKey }}
  ANTHROPIC_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.azureOpenai.apiKey }}
  AZURE_OPENAI_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.api.authToken }}
  API_AUTH_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.api.webhookSecret }}
  API_WEBHOOK_SECRET: {{ . | quote }}
  {{- end }}
  {{- if .Values.slack.botToken }}
  SLACK_BOT_TOKEN: {{ .Values.slack.botToken | quote }}
  SLACK_APP_TOKEN: {{ .Values.slack.appToken | quote }}
  SLACK_SIGNING_SECRET: {{ .Values.slack.signingSecret | quote }}
  {{- end }}
{{- end }}
{{- end }}
