apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubedevaiops.fullname" . }}
  labels:
    {{- include "kubedevaiops.labels" . | nindent 4 }}
rules:
  # Full read access to cluster resources for diagnostics
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "endpoints", "events",
                "configmaps", "secrets", "namespaces", "nodes",
                "persistentvolumes", "persistentvolumeclaims",
                "serviceaccounts", "resourcequotas", "limitranges"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets", "podsecuritypolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
  # KubeDevAIOps CRDs
  - apiGroups: ["kubedevaiops.io"]
    resources: ["aitasks", "aitasks/status", "aiskills", "aiskills/status",
                "aipolicies", "aipolicies/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Kopf scans served CRDs at startup
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  # Kopf needs to manage its own coordination leases
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Events for Kopf
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Write access for managed resources
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets",
                "namespaces", "serviceaccounts"]
    verbs: ["create", "update", "patch", "delete"]
