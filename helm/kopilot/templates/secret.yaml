{{- if not .Values.existingSecret }}
{{- $secretName := printf "%s-secrets" (include "kopilot.fullname" .) -}}
{{- /*
  The API is authenticated by default. When api.authToken is empty the chart
  generates one, but `randAlphaNum` re-rolls on every render, so first look up
  the live Secret and keep whatever token is already in use — otherwise every
  `helm upgrade` would silently invalidate the operator's bearer token.
  `lookup` returns an empty map during `helm template` and `--dry-run`, so a
  rendered-but-not-applied manifest shows a throwaway value; that is expected.
*/ -}}
{{- $token := .Values.api.authToken -}}
{{- if not $token -}}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
  {{- $prior := "" -}}
  {{- if $existing -}}
    {{- $prior = get ($existing.data | default dict) "API_AUTH_TOKEN" | default "" -}}
  {{- end -}}
  {{- $token = ternary (b64dec $prior) (randAlphaNum 32) (ne $prior "") -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "kopilot.labels" . | nindent 4 }}
type: Opaque
stringData:
  API_AUTH_TOKEN: {{ $token | quote }}
  {{- with .Values.openai.apiKey }}
  OPENAI_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.gemini.apiKey }}
  GEMINI_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.anthropic.apiKey }}
  ANTHROPIC_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.azureOpenai.apiKey }}
  AZURE_OPENAI_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.api.webhookSecret }}
  API_WEBHOOK_SECRET: {{ . | quote }}
  {{- end }}
  {{- if .Values.slack.botToken }}
  SLACK_BOT_TOKEN: {{ .Values.slack.botToken | quote }}
  SLACK_APP_TOKEN: {{ .Values.slack.appToken | quote }}
  SLACK_SIGNING_SECRET: {{ .Values.slack.signingSecret | quote }}
  {{- end }}
{{- end }}
