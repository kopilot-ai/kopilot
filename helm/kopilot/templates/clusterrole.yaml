apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kopilot.fullname" . }}
  labels:
    {{- include "kopilot.labels" . | nindent 4 }}
rules:
  # ── Reads ────────────────────────────────────────────────────────────────
  # Every resource here backs a command in a shipped skill or in the
  # executor:
  #   pods, pods/log        troubleshooting.yaml (describe pod, logs --previous)
  #   services, endpoints   networking.yaml (get svc, get endpoints)
  #   events                monitoring.yaml (get events --field-selector)
  #   configmaps            middleware.read_resource("configmap:<name>:<ns>")
  #   namespaces, nodes     monitoring.yaml (top nodes), agent orientation
  #   pvc, pv               cost_optimization.yaml (get pvc -A)
  #   serviceaccounts       security.yaml RBAC recon
  #   resourcequotas,
  #   limitranges           cost_optimization.yaml request/limit comparison
  #
  # `secrets` is deliberately absent. No shipped skill reads a Secret, and a
  # cluster-wide secrets read hands every credential in the cluster to an LLM
  # context window. Turn on rbac.extendedRead if you accept that trade.
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "endpoints", "events",
                "configmaps", "namespaces", "nodes",
                "persistentvolumes", "persistentvolumeclaims",
                "serviceaccounts", "resourcequotas", "limitranges"]
    verbs: ["get", "list", "watch"]
  # administration.yaml (rollout status/history), cost_optimization.yaml
  # (get deploy -A custom-columns on .status.readyReplicas)
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets",
                "deployments/scale", "replicasets/scale", "statefulsets/scale"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  # monitoring.yaml (get hpa -A)
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  # networking.yaml (get networkpolicies), ingress inspection
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
  # security.yaml (get roles,rolebindings,clusterroles,clusterrolebindings -A)
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  # monitoring.yaml (top nodes, top pods -A)
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]

  # ── Writes the agent's own control plane needs ───────────────────────────
  # Kopilot CRDs: the operator reconciles AITask/AISkill/AIPolicy and writes
  # their status (operator/handlers.py).
  - apiGroups: ["kopilot-ai.github.io"]
    resources: ["aitasks", "aitasks/status", "aiskills", "aiskills/status",
                "aipolicies", "aipolicies/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Kopf scans served CRDs at startup.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  # Kopf peering/coordination leases.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Kopf posts progress events on the objects it reconciles.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]

  # ── Scoped workload writes ───────────────────────────────────────────────
  # administration.yaml is the only shipped skill that mutates:
  #   `kubectl create deployment`            -> create
  #   `kubectl scale deployment/<name>`      -> deployments/scale update+patch
  #   `kubectl rollout undo deployment/...`  -> patch
  # Deletion is not among them, and neither is anything on pods,
  # serviceaccounts, namespaces, or daemonsets — those live behind
  # rbac.extendedWrite below. Every verb here is still approval-gated in the
  # agent; RBAC is the second lock, not the first.
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: ["update", "patch"]

{{- if .Values.rbac.extendedRead }}

  # ── rbac.extendedRead (opt-in) ───────────────────────────────────────────
  # Cluster-wide Secret reads. Only turn this on if you want the agent to be
  # able to put credential material into an LLM prompt.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
{{- end }}

{{- if .Values.rbac.extendedWrite }}

  # ── rbac.extendedWrite (opt-in) ──────────────────────────────────────────
  # Off by default. Needed for:
  #   networking.yaml's `kubectl run tmp --rm ... busybox` DNS/connectivity
  #     probe (pods create + delete)
  #   deleting workloads after an approval (apps/batch delete)
  #   Helm releases that create their own namespaces, service accounts, or
  #     DaemonSets (`helm install --create-namespace`)
  # This is the tier that lets an approved command remove things.
  - apiGroups: [""]
    resources: ["pods", "pods/exec", "configmaps", "services",
                "serviceaccounts", "namespaces"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["create", "update", "patch", "delete"]
{{- end }}
